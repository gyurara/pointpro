plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.blockchain'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// Spring MVC가 @PathVariable/@RequestParam의 파라미터 이름을 리플렉션으로 읽으려면
// 바이트코드에 파라미터 이름이 남아야 한다. -parameters 플래그가 이를 보장한다.
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs.add('-parameters')
}

repositories {
	mavenCentral()
}

// fabric-gateway 1.7.1 의 fabric-protos 0.3.4 는 protobuf gencode 4.28.2 로 생성됨.
// fabric-gateway 가 끌어오는 protobuf-java 4.26.1 런타임이 gencode 보다 낮아
// SerializedIdentity 정적 초기화가 ProtobufRuntimeVersionException 으로 실패한다.
// 런타임을 gencode 에 맞춰 강제로 올린다(Spring BOM 미관리 의존성이라 force 사용).
configurations.all {
	resolutionStrategy {
		force 'com.google.protobuf:protobuf-java:4.28.2'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// Hyperledger Fabric Gateway Java SDK (Fabric 2.4+ Gateway 접속)
	implementation 'org.hyperledger.fabric:fabric-gateway:1.7.1'
	implementation 'io.grpc:grpc-netty-shaded:1.68.1'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootRun') {
	workingDir = file('../..')
}

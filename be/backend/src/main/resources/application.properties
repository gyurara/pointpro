spring.application.name=backend

# MySQL DataSource (createDatabaseIfNotExist=true 로 DB 자동 생성)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:petchain}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP - MySQL 초기화 대기 (docker compose 후 바로 실행해도 연결 실패 방지)
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000

# JPA / Hibernate (update: 엔티티 기반 테이블 자동 생성/갱신)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
admin.login-id=${ADMIN_LOGIN_ID:admin}
admin.password=${ADMIN_PASSWORD:admin1234}

# JWT
jwt.secret=${JWT_SECRET:petchain-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-algo}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

server.port=${SERVER_PORT:8080}

# OAuth 콜백 후 리다이렉트할 프론트엔드 URL
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# CORS 허용 Origin 목록 (쉼표 구분). 운영에서는 실제 도메인만 지정할 것.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

# Google OAuth
oauth.google.client-id=${GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/oauth/google/callback}

# Naver OAuth
oauth.naver.client-id=${NAVER_CLIENT_ID:}
oauth.naver.client-secret=${NAVER_CLIENT_SECRET:}
oauth.naver.redirect-uri=${NAVER_REDIRECT_URI:http://localhost:8080/api/auth/oauth/naver/callback}

# Kakao OAuth
oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
oauth.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/oauth/kakao/callback}

# ── Fabric 체인 연동 ──────────────────────────
# chain.enabled=true 로 하면 실제 Fabric 네트워크에 연결한다 (기본 false = 오프체인만)
chain.enabled=${CHAIN_ENABLED:false}
chain.msp-id=${CHAIN_MSP_ID:Org1MSP}
chain.channel=${CHAIN_CHANNEL:petchannel}
chain.chaincode=${CHAIN_CHAINCODE:petchain}
chain.peer-endpoint=${CHAIN_PEER_ENDPOINT:localhost:7051}
chain.peer-host-override=${CHAIN_PEER_HOST_OVERRIDE:peer0.org1.example.com}
# test-network crypto 경로 (환경변수 우선, 기본값은 현재 사용자 홈 기준)
chain.tls-cert-path=${CHAIN_TLS_CERT_PATH:${user.home}/go/src/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt}
chain.cert-path=${CHAIN_CERT_PATH:${user.home}/go/src/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/signcerts/User1@org1.example.com-cert.pem}
chain.key-dir=${CHAIN_KEY_DIR:${user.home}/go/src/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/keystore/}

# Fabric 체인코드 연동 오버라이드
# 단독 사용 금지 — docker-compose.yml 과 함께 사용한다.
#
# 사용법 (직접):
#   docker-compose -f docker-compose.yml -f docker-compose.chain.yml up -d
#
# 권장 사용법 (스크립트):
#   bash scripts/start.sh --chain
#
# 전제 조건:
#   - bash scripts/start.sh --chain 을 실행하면 Fabric 네트워크가 먼저 뜨고
#     FABRIC_SAMPLES_DIR 환경변수가 자동으로 설정됨.
#   - 또는 수동으로: export FABRIC_SAMPLES_DIR=~/fabric-samples 후 실행.

services:
  backend:
    extra_hosts:
      # Linux 에서 컨테이너 → 호스트 Fabric peer 접근을 위한 호스트 게이트웨이
      - "host.docker.internal:host-gateway"
    volumes:
      # Fabric 인증서를 컨테이너 내부 /fabric/orgs 에 읽기 전용으로 마운트
      - "${FABRIC_SAMPLES_DIR:-${HOME}/fabric-samples}/test-network/organizations:/fabric/orgs:ro"
    environment:
      CHAIN_ENABLED: "true"
      CHAIN_MSP_ID: "Org1MSP"
      CHAIN_CHANNEL: "petchannel"
      CHAIN_CHAINCODE: "petchain"
      # 컨테이너 → 호스트 7051 (peer0.org1)
      CHAIN_PEER_ENDPOINT: "host.docker.internal:7051"
      CHAIN_PEER_HOST_OVERRIDE: "peer0.org1.example.com"
      # 마운트된 경로에서 인증서 참조
      CHAIN_TLS_CERT_PATH: "/fabric/orgs/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt"
      CHAIN_CERT_PATH: "/fabric/orgs/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/signcerts/Admin@org1.example.com-cert.pem"
      CHAIN_KEY_DIR: "/fabric/orgs/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/keystore"

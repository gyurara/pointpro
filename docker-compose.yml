#
# PetChain Docker Compose — 백엔드 + 프론트엔드 전용
#
# MySQL은 로컬 설치본을 사용합니다 (Docker 아님).
# 로컬 MySQL 접속: host.docker.internal:3306 (Linux/Mac 공통)
#
# 권장 시작법:
#   bash scripts/start.sh              # 로컬 MySQL + 백엔드(네이티브) + 프론트(네이티브)
#   bash scripts/start.sh --chain      # + Fabric 체인코드 포함
#
# Docker Compose 직접 사용 (백엔드+프론트만 컨테이너로 올릴 때):
#   docker compose up -d
#   docker compose -f docker-compose.yml -f docker-compose.chain.yml up -d   # 체인 포함

services:
  backend:
    build:
      context: ./be/backend
      dockerfile: Dockerfile
    container_name: petchain-backend
    expose:
      - "8080"
    extra_hosts:
      # 컨테이너 → 로컬 MySQL(호스트) 접근용 (Linux 포함 전 플랫폼 호환)
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # 로컬 MySQL 접속: host.docker.internal 로 호스트를 가리킴
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-petchain}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-3600000}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-604800000}
      SERVER_PORT: 8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      ADMIN_LOGIN_ID: ${ADMIN_LOGIN_ID:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost/api/auth/oauth/google/callback}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      NAVER_REDIRECT_URI: ${NAVER_REDIRECT_URI:-http://localhost/api/auth/oauth/naver/callback}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-http://localhost/api/auth/oauth/kakao/callback}
      # 체인코드 연동 (chain.enabled=false 이면 무시됨)
      CHAIN_ENABLED: ${CHAIN_ENABLED:-false}
      CHAIN_MSP_ID: ${CHAIN_MSP_ID:-Org1MSP}
      CHAIN_CHANNEL: ${CHAIN_CHANNEL:-petchannel}
      CHAIN_CHAINCODE: ${CHAIN_CHAINCODE:-petchain}
      CHAIN_PEER_ENDPOINT: ${CHAIN_PEER_ENDPOINT:-host.docker.internal:7051}
      CHAIN_PEER_HOST_OVERRIDE: ${CHAIN_PEER_HOST_OVERRIDE:-peer0.org1.example.com}
      CHAIN_TLS_CERT_PATH: ${CHAIN_TLS_CERT_PATH:-}
      CHAIN_CERT_PATH: ${CHAIN_CERT_PATH:-}
      CHAIN_KEY_DIR: ${CHAIN_KEY_DIR:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./fe/petchain
      dockerfile: Dockerfile
    container_name: petchain-frontend
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
